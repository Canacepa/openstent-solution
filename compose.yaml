
# Base services, shared by development and pre-production.
#
#   development     docker compose up -d            (this file + compose.override.yaml: database port, mailpit)
#   pre-production  docker compose -f compose.yaml -f compose.preprod.yaml --env-file .env.preprod up -d --build
#
# The application itself only runs in the pre-production stack (compose.preprod.yaml); in development it
# runs with the Symfony CLI against this database.
services:
###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openstent}
      MYSQL_USER: ${MYSQL_USER:-app}
      # development defaults only: compose.preprod.yaml makes every password mandatory
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

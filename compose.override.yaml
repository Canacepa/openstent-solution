
# Development only (picked up automatically by a plain `docker compose up`).
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      # a random free host port: `docker compose port database 3306` tells which one
      - "3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
